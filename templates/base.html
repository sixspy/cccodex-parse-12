<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ lab }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/parse.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><a href="/jobs/">{{ lab }}</a></div>
    <nav class="nav">
      <a href="/jobs/">解析任务</a>
      <a href="/inspections/">抽检列表</a>
      <a href="/policy/">抽检策略</a>
    </nav>
    {% if user %}<div class="who">{{ user }} · <a href="/logout">退出</a></div>{% endif %}
  </header>
  <main class="sheet">
    {% if messages %}
      <ul class="flash">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
